; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Both boards default to 240 MHz, i.e. the maximum. Dropping to 160 MHz
; saves roughly 10-15 mA and lowers the core temperature. The APB peripheral
; bus stays at 80 MHz regardless of the core clock, so display SPI, gamepad I2C
; and motor PWM timing do NOT change - only what the CPU computes gets slower.
; Below 80 MHz the clock leaves the PLL for the crystal and WiFi stops working,
; so 80 MHz is the floor.
board_build.f_cpu = 160000000L
lib_deps = madhephaestus/ESP32Encoder@^0.11.7
