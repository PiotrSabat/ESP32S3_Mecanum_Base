; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Domyslna dla obu plytek jest 240 MHz, czyli maksimum. Zejscie na 160 MHz
; oszczedza ok. 10-15 mA i obniza temperature rdzenia. Magistrala peryferyjna
; APB zostaje na 80 MHz niezaleznie od zegara rdzenia, wiec taktowanie SPI
; wyswietlacza, I2C gamepadow i PWM silnikow sie NIE zmienia - wolniej idzie
; tylko to, co liczy procesor. Ponizej 80 MHz zegar schodzi z PLL na kwarc
; i WiFi przestaje dzialac, wiec 80 MHz to podloga.
board_build.f_cpu = 160000000L
lib_deps = madhephaestus/ESP32Encoder@^0.11.7
